# CI вызывает стандартные build systems напрямую; политики сборки принадлежат CMake/MSBuild manifests.
# Runner Windows x64 предоставляет Visual Studio 2026 и CMake из PATH.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-contracts:
    name: Контракты Agent Skills и валидаторов PR (Windows)
    runs-on: windows-2025-vs2026
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: uv для repository tooling
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: latest-known
          enable-cache: false
      - name: Метаданные и ссылки Agent Skills
        run: uv run --python 3.15 --with-requirements .github/scripts/requirements.txt python -B .github/scripts/check_skill_contracts.py --root .
      - name: Регрессионные тесты валидаторов
        run: uv run --python 3.15 --with-requirements .github/scripts/requirements.txt python -B -m unittest discover -s .github/scripts -p "test_check_*.py" -v

  verify:
    name: Native CMake и managed .NET verification (Windows x64)
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: .NET SDK из global.json
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: uv для проверки генератора ассетов
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: latest-known
          enable-cache: false

      - name: Целостность генерации игровых ассетов
        run: uv run tests/tools/test_prepare_game_assets.py

      - name: Кэш архива OpenCV
        uses: actions/cache@v6.1.0
        with:
          path: artifacts/downloads
          key: opencv-${{ hashFiles('native/opencv.json') }}

      - name: Кэш NuGet
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Native configure, build и CTest
        working-directory: native
        run: cmake --workflow --preset native-x64-release

      - name: Проверка хешей и подготовка файлов рендерера
        run: pwsh -NoProfile -File tools/AzurPilot.TuiHarness/prepare.ps1 -AssetsOnly

      - name: Locked NuGet restore
        run: dotnet restore AzurPilot.slnx --locked-mode

      - name: Managed build
        run: dotnet build AzurPilot.slnx --configuration Release --no-restore -warnaserror

      - name: Managed interop и repository tests
        run: dotnet test tests/AzurPilot.Tests/AzurPilot.Tests.csproj --configuration Release --no-restore --no-build

      - name: Публикация native build и CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-Release
          path: |
            artifacts/native/bin/Release/AzurPilot.Native.*
            artifacts/native/runtime/Release/AzurPilot.Native.dll
            artifacts/native/cmake/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 7
